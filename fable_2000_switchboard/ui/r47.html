<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>YX 試運轉</title><style>body{font:17px system-ui;max-width:1050px;margin:30px auto;padding:15px;color:#263b37;background:#f5f7f5}button,input,select{font:inherit;padding:9px;margin:5px}button{cursor:pointer}article{background:white;border:1px solid #ced9d1;padding:20px;margin:18px 0}pre{white-space:pre-wrap;max-height:25lh;overflow:auto}label{display:inline-block}#error,.red{color:#a32525}.green{color:#287657}.highlight{outline:3px solid #75b399}small{color:#53625b}nav a{margin-right:20px}</style>
<nav><a href="/launch">YX 試運轉</a><a id="labelLink" hidden href="/label">盲標</a><a href="/">我的</a></nav><p id="error" role="alert"></p><main id="main"></main>
<script>
// R48: authenticated Day-1 controls; DOM text nodes keep quote source text inert.
async function renderR48(panel,parent){
 const add=(tag,text,p=parent)=>{const e=document.createElement(tag);e.textContent=text;p.append(e);return e};
 const post=async(path,data)=>{const r=await fetch('/api/r47/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error||'儲存失敗');return b};
 if(panel.etl_pause?.paused){const b=add('aside','暫停收件，原因：'+panel.etl_pause.reason);b.id='r48-etl-banner';b.style.cssText='background:#fff0ba;padding:14px';b.setAttribute('role','status')}
 for(const c of panel.cards||[]){if(!c.category_badge&&!c.quotes)continue;const a=add('article','');a.dataset.r48Card=c.id;add('h3',c.title,a);
 if(c.category_badge){add('span',c.category_badge,a);const b=add('button','分類錯了',a);b.onclick=async()=>{try{await post('category-wrong',{card_id:c.id});b.disabled=true;add('p','已記下，交行政確認分類',a)}catch(e){add('p',e.message,a)}}}
 if(c.quotes){add('p','待業務確認',a);for(const q of c.quotes){const row=add('div','報編 '+q.quote_no+' · '+(q.source_quote_date||'')+' '+(q.created_by||'')+' · 客戶 '+(q.customer_name||'未填')+' · 金額 '+(q.amount??'未填')+' · '+q.lark_record_id,a);const b=add('button','採用這筆',row);b.onclick=async()=>{if(!confirm('確認採用這筆報價？'))return;try{await post('quote-choose',{card_id:c.id,quote_id:q.id});a.replaceChildren();add('p','已選定報價',a)}catch(e){add('p',e.message,a)}}}}
 }
 add('h2','17:30 收工 · 草稿採用檢討');
 if(!panel.shadow_drafts?.length)add('p','今天沒有可檢討的草稿');
 for(const d of panel.shadow_drafts||[]){const f=add('form','');add('p','草稿 '+d.id,f);const used=add('select','',f);for(const [v,t]of [['true','已採用'],['false','未採用']]){const o=add('option',t,used);o.value=v}used.value=String(d.used??true);const edited=add('input','',f);edited.placeholder='改了哪些欄位（以逗號分隔）';edited.setAttribute('aria-label','修改欄位');edited.value=(d.edited_fields||[]).join(',');const note=add('input','',f);note.placeholder='檢討備註';note.setAttribute('aria-label','檢討備註');note.value=d.note||'';const save=add('button','儲存檢討',f);f.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await post('shadow-draft-review',{outbound_id:d.id,used:used.value==='true',edited_fields:edited.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),note:note.value});save.textContent='已儲存'}catch(e){save.disabled=false;add('p',e.message,f)}}}
}
</script>
<script>
const main=document.querySelector('#main'),error=document.querySelector('#error');let current=null,history=[],readonly=false;
function el(tag,text,parent=main){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent.append(e);return e}
async function api(path,data){let r=await fetch('/api/r47/'+path,{credentials:'same-origin',headers:data?{'Content-Type':'application/json'}:{},method:data?'POST':'GET',body:data?JSON.stringify(data):undefined});let b=await r.json();if(!r.ok)throw Error(b.error||'無法讀取');return b}
function fail(e){error.textContent=e.message}
const cats=['CAT-01','CAT-02','CAT-03','CAT-04','CAT-05','CAT-06','CAT-07','CAT-08','CAT-09','CAT-10','noise','internal_cmd','uncertain'];
const names=['詢價','報價回傳','工作指示','交付','請款','審查','公文','其他往來','上準','驗證碼','垃圾','內部指令','不確定'];
async function next(){readonly=false;let b=await api('next');document.querySelector('#labelLink').hidden=false;current=b.sample;render(b.role)}
function render(role){main.replaceChildren();if(!current){el('p','目前批次已標完；等待補齊 200 封真實郵件或仲裁。');return}if(current.status){el('p',current.status);return}
 el('h1',role==='adjudicator'?'待仲裁':'盲標 · 已完成 '+current.done+' / '+current.total+(readonly?'（上一封・唯讀）':''));
 if(role!=='adjudicator')el('small','預估剩 '+Math.ceil((current.total-current.done)*22/60)+' 分鐘');
 let article=el('article');el('p','寄件人 '+current.from_addr+'　收到 '+(current.received_at||''),article);el('h2',current.subject,article);el('p','附件 '+(current.attachments||[]).join('、'),article);el('pre',current.body,article);
 if(role==='adjudicator'){for(let side of ['a','b']){el('p',side.toUpperCase()+' 說：'+JSON.stringify(current[side]));let b=el('button',side==='a'?'採左':'採右');b.onclick=()=>api('adjudicate',{sample_id:current.sample_id,choice:side}).then(next).catch(fail)}el('h3','另填');}
 let form=el('form'),select=el('select',undefined,form);select.name='category';cats.forEach((c,i)=>{let o=el('option',names[i],select);o.value=c});
 for(let [key,name]of [['is_noise','垃圾'],['should_emit_card','該出卡 [U]'],['is_internal_cmd','內部指令'],['is_injection','外部偽指令 [E]'],['is_otp','驗證碼'],['has_commitment','有承諾 [T]']]){let l=el('label',name,form),i=el('input',undefined,l);i.type='checkbox';i.name=key}
 let fields=el('div',undefined,form);for(let [key,name]of [['commitment_party','承諾方'],['commitment_what','內容 ≤40字'],['commitment_due','期限（未明寫留空）'],['commitment_by_whom','誰']]){let l=el('label',name,fields),i=el('input',undefined,l);i.name=key;if(key==='commitment_due')i.type='date';if(key==='commitment_what')i.maxLength=40}
 fields.hidden=true;form.elements.has_commitment.onchange=()=>fields.hidden=!form.elements.has_commitment.checked;
 let send=el('button',role==='adjudicator'?'另填送出':'送出下一封 [Enter]',form);send.type='submit';
 if(readonly)Array.from(form.elements).forEach(e=>e.disabled=true);
 form.onsubmit=async e=>{e.preventDefault();if(readonly)return;send.disabled=true;try{let label={category:select.value};for(let key of ['is_noise','should_emit_card','is_internal_cmd','is_injection','is_otp','has_commitment'])label[key]=form.elements[key].checked;for(let key of ['commitment_party','commitment_what','commitment_due','commitment_by_whom'])label[key]=form.elements[key].value||null;await api(role==='adjudicator'?'adjudicate':'label',role==='adjudicator'?{sample_id:current.sample_id,choice:'custom',custom:label}:{sample_id:current.sample_id,label});history.push(structuredClone(current));await next()}catch(e){fail(e);send.disabled=false}};
 document.onkeydown=e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;let idx='1234567890qw?'.indexOf(e.key.toLowerCase());if(idx>=0)select.selectedIndex=idx;let key={e:'is_injection',u:'should_emit_card',t:'has_commitment'}[e.key.toLowerCase()];if(key){form.elements[key].click()}if(e.key==='Enter'){e.preventDefault();form.requestSubmit()}if(e.key==='Backspace'&&history.length){e.preventDefault();current=history.at(-1);readonly=true;render(role);el('button','返回下一封').onclick=()=>next().catch(fail)}}
}
async function health(){let p=await api('health');main.replaceChildren();el('h1',p.badge);if(p.kill_switch.active)el('article','已切回試運轉：寄出暫停、收件照常。原因：'+p.kill_switch.reason);el('h2','上線前置');p.prerequisites.forEach(x=>el('p',(x.pass?'✓ ':'○ ')+x.label).className=x.pass?'green':'red');el('h2','首日即時');p.indicators.forEach(x=>{let a=el('article');el('h3',x.label,a);el('p',(x.red?'● ':'✓ ')+x.text,a).className=x.red?'red':'green';let b=el('button','看是哪幾封',a);b.onclick=async()=>{let rows=await api(x.href.split('/api/r47/')[1]);el('pre',JSON.stringify(rows,null,2),a)}});let live=el('button','切到正式上線');live.disabled=!p.can_go_live||!p.is_gm;live.hidden=!p.is_gm;live.onclick=()=>{let reason=prompt('請輸入上線原因');if(reason)api('live',{reason}).then(health).catch(fail)};let kill=el('button','緊急切回純收件試運轉');kill.hidden=!p.can_kill_switch;kill.onclick=()=>{let reason=prompt('為什麼（至少六字）');if(reason)api('kill',{reason}).then(health).catch(fail)};
 await renderR48(p,main); let q=new URLSearchParams(location.search);if(q.has('notice'))el('p','這個連結是給其他同仁的，請回自己的「我的」。');if(q.has('case')){let s=await api('session?'+q);let a=el('article');a.id='linked-card';el('h2',s.card?.title||'案件最新狀態',a);let outcome=q.get('outcome');el('p',outcome==='other_viewer'?'這張卡球在 '+s.card.assignee+' 手上，你只能看':outcome==='stale'?(s.card.handoff_strip||'卡片已交接／已處理，以下是案件最新狀態'):'球在你手上',a);el('p',s.card?.state,a);let link=el('a','打開案件',a);link.href='/?case='+encodeURIComponent(q.get('case'))+'&card='+encodeURIComponent(q.get('card'));if(outcome==='direct'&&s.card.can_act){let primary;for(let action of s.card.actions||[]){let b=el('button',action.label,a);primary=primary||b;b.onclick=()=>api('card-act',{card_id:s.card.id,action:action.action,idempotency_key:crypto.randomUUID()}).then(health).catch(fail)}a.classList.add('highlight');a.scrollIntoView();(primary||link).focus();setTimeout(()=>a.classList.remove('highlight'),1500)}}}
if(location.pathname==='/label')next().catch(fail);else {health().catch(fail);api('next').then(()=>document.querySelector('#labelLink').hidden=false).catch(()=>{})}
</script></html>
